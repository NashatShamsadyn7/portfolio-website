<style>
:root { --ink:#0C0B0A; --line:#262320; --paper:#F2EDE4; --muted:#ACA398; --brass:#D7A94B; }
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;background:var(--ink);color:var(--muted);
     font-family:'Outfit',system-ui,sans-serif;font-weight:300;padding:2rem;text-align:center}
.card{max-width:34rem}
.kicker{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.18em;

   line-height:.98;color:var(--paper);letter-spacing:-.02em;margin-bottom:1.25rem}
h1 em{font-style:italic;color:var(--brass)}
p{line-height:1.7;margin-bottom:2.25rem;text-wrap:pretty}
.links{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:.55rem;padding:.9rem 1.55rem;border-radius:10px;
      font-weight:500;font-size:.95rem;text-decoration:none;transition:filter .18s ease,border-color .18s ease,color .18s ease}
a.solid{background:var(--brass);color:#17130C}
a.solid:hover{filter:brightness(1.08)}
a.quiet{border:1px solid var(--line);color:var(--paper)}
a.quiet:hover{border-color:var(--brass);color:var(--brass)}
.fine{margin-top:3rem;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.12em;
      text-transform:uppercase;color:#6E675E}
</style>
